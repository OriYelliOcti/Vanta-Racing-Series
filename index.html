<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vanta Racing Series</title>
  <meta name="description" content="Vanta Racing Series — Roblox racing league with F1 and F2 divisions, the full grid, race standings, fantasy championship and a steward desk.">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="assets/style.css?v=20261126b">
</head>
<body>
  <main class="wrap"><div id="app"><p class="muted">Loading…</p></div></main>
  <script src="assets/app.js?v=20261126b"></script>
  <script>
    (async () => {
      const host = document.getElementById("app");
      try {
        const [cfg, lineups, results, schedule, decisions, news] = await Promise.all([
          VRS.json("data/config.json"),
          VRS.json("data/lineups.json"),
          VRS.json("data/results.json"),
          VRS.json("data/schedule.json"),
          VRS.json("data/decisions.json"),
          VRS.json("data/news.json").catch(() => ({ items: [] })),
        ]);
        const pal = await VRS.palette();
        VRS.shell(cfg, "index.html");

        const rounds = results.rounds || [];
        const teams = lineups.teams || [];
        const slots = cfg.slots || [];
        const racing = teams.filter((t) => t.division === "F1" || t.division === "F2");
        const slotApplies = (slot, team) =>
          slot.teams ? slot.teams.includes(team.key) : team.division !== "FIA";
        const seats = teams.reduce(
          (n, team) =>
            n +
            slots
              .filter((slot) => slotApplies(slot, team))
              .reduce((m, slot) => m + (slot.capacity || 1), 0),
          0
        );
        const filled = teams.reduce(
          (n, team) =>
            n + Object.values(team.slots || {}).reduce((m, slot) => m + (slot.members || []).length, 0),
          0
        );
        const calendar = (schedule.rounds || []).slice().sort((a, b) => a.round - b.round);
        const f1 = VRS.computeStandings(rounds, cfg, "F1");
        const top = f1.drivers.slice(0, 5);
        const latest = (decisions.decisions || []).slice(-3).reverse();
        const f1Teams = racing.filter((t) => t.division === "F1").length;
        const f2Teams = racing.filter((t) => t.division === "F2").length;
        const items = (news.items || [])
          .slice()
          .sort((a, b) => String(b.at || "").localeCompare(String(a.at || "")))
          .slice(0, 5);
        const next = VRS.nextEvent(schedule, cfg);

        host.innerHTML = `
          <h2 style="margin-top:0">Latest</h2>
          <div class="news">
            ${
              items.length
                ? items
                    .map(
                      (item) => `<article class="card newsitem">
                        ${
                          item.image
                            ? `<img src="${VRS.esc(item.image)}" alt="${VRS.esc(
                                item.imageAlt || ""
                              )}" loading="lazy" style="width:100%;height:auto;border-radius:12px;margin:0 0 12px;display:block">`
                            : ""
                        }
                        <h3>${VRS.esc(item.title || "Announcement")}</h3>
                        <p class="meta">${VRS.esc(String(item.at || "").slice(0, 10))}${
                        item.by ? ` · ${VRS.esc(item.by)}` : ""
                      }</p>
                        <p>${VRS.esc(String(item.body || "").split(/\n\s*\n/)[0])}</p>
                      </article>`
                    )
                    .join("") +
                  `<p class="small muted" style="margin:0"><a href="news.html">Older posts →</a></p>`
                : `<div class="card muted">Nothing published yet.</div>`
            }
          </div>

          <div class="hero" style="margin-top:26px">
            <div>
              <h1>${f1Teams} F1 teams. ${f2Teams} F2 teams. One paddock.</h1>
              <p class="lead">Vanta Racing Series is a Roblox racing league where the
              paperwork is real: every team has a budget, every signing costs it, and
              every seat is written down. Lineups come straight from Discord roles, and
              stewards publish their decisions through the same desk the league runs on.</p>
              <div class="row">
                <a class="btn" href="seats.html">Open seats</a>
                <a class="btn" href="grid.html">See the grid</a>
                <a class="btn" href="rules.html">The rules</a>
                ${cfg.discordInvite ? `<a class="btn" href="${VRS.esc(cfg.discordInvite)}" target="_blank" rel="noopener">Join the Discord</a>` : ""}
              </div>
            </div>
            <div class="card">
              ${VRS.countdown(next)}
              <div class="stats" style="margin-top:16px">
                <div class="stat"><b>${racing.length}</b><span>racing teams</span></div>
                <div class="stat"><b>${filled}/${seats}</b><span>seats filled</span></div>
                <div class="stat"><b>${calendar.length}</b><span>rounds scheduled</span></div>
                <div class="stat"><b>${f1.rounds}</b><span>F1 rounds scored</span></div>
              </div>
              <p class="small muted" style="margin:14px 0 0">Lineups refresh every
              ${VRS.esc(cfg.syncHours || 5)} hours from Discord${
                lineups.generatedAt
                  ? ` — last sync ${VRS.esc(new Date(lineups.generatedAt).toLocaleString())}`
                  : ""
              }.</p>
            </div>
          </div>

          <h2>F1 championship</h2>
          <div class="card">
            ${
              top.length
                ? `<table><thead><tr><th class="pos">#</th><th>Driver</th><th>Team</th>
                   <th class="num">Wins</th><th class="num">Podiums</th><th class="num">Pts</th></tr></thead>
                   <tbody>${top
                     .map(
                       (d, i) => `<tr><td class="pos">${i + 1}</td>
                       <td><b>${VRS.esc(d.driver)}</b></td>
                       <td class="muted"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${VRS.colorOf(
                         pal, d.team
                       )};margin-right:7px"></span>${VRS.esc(VRS.teamName(lineups, d.team))}</td>
                       <td class="num">${d.wins}</td><td class="num">${d.podiums}</td>
                       <td class="num"><b>${d.points}</b></td></tr>`
                     )
                     .join("")}</tbody></table>
                   <p class="small muted" style="margin:10px 0 0">
                   <a href="races.html">Full standings →</a></p>`
                : `<p class="muted">No results published yet. The first timing sheet
                   will appear here after the opening round.</p>`
            }
          </div>

          <div class="grid2" style="margin-top:18px">
            <div class="card">
              <h2 style="margin-top:0">Calendar</h2>
              ${
                calendar.length
                  ? `<ul class="list">${calendar
                      .slice(0, 4)
                      .map(
                        (r) => `<li><span class="spread">
                          <b>${VRS.esc(r.flag || "🏁")} ${VRS.esc(r.circuit || "TBA")}</b>
                          <span class="small muted">R${VRS.esc(r.round)} · ${VRS.esc(
                            r.country || ""
                          )}</span></span></li>`
                      )
                      .join("")}</ul>
                    <p class="small muted" style="margin:10px 0 0">
                    <a href="schedule.html">Full calendar →</a> · further rounds may be added.</p>`
                  : `<p class="muted">No rounds published yet. <a href="schedule.html">Calendar →</a></p>`
              }
            </div>
            <div class="card">
              <h2 style="margin-top:0">Latest steward decisions</h2>
              ${
                latest.length
                  ? `<ul class="list">${latest
                      .map(
                        (d) => `<li><b>${VRS.esc(d.subject || "—")}</b>
                        <span class="chip">R${VRS.esc(d.round)}</span>
                        <div class="small muted">${VRS.esc((d.text || "").slice(0, 140))}</div></li>`
                      )
                      .join("")}</ul>`
                  : `<p class="muted">Nothing published yet. Decisions land here first,
                     straight from the FIA stewarding desk.</p>`
              }
            </div>
          </div>`;
      } catch (error) {
        VRS.fail(host, error);
      }
    })();
  </script>
</body>
</html>
